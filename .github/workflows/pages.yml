name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every two hours, off the hour so the run does not queue behind other jobs.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh the RSS cache
        run: node scripts/fetch-rss.mjs
        continue-on-error: true

      - name: Build the photo manifest
        run: node scripts/build-photo-manifest.mjs

      - name: Check iOS 12 compatibility
        run: node scripts/check-compat.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

